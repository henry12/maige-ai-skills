name: 任务与需求建议
description: 描述你想完成的工作和期望交付
title: "[需求] "
body:
  - type: textarea
    id: task
    attributes:
      label: 你要完成什么工作
      description: 描述具体任务、输入材料和使用频率，避免只列功能名称。
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 期望拿到什么成果
      description: 格式、修改需求和使用环境。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 目前的做法与卡点
      description: 可选；请勿提供私人或公司敏感资料。
