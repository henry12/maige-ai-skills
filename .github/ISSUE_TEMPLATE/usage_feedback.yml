name: 实际使用反馈
description: 记录成功、失败和需要人工协助的真实尝试
title: "[使用反馈] "
body:
  - type: markdown
    attributes:
      value: "此表供可运行版本发布后使用。提交公开反馈不等于授权项目在自媒体转载；转载前会另行取得同意。请勿提交私人材料。"
  - type: input
    id: version
    attributes:
      label: Skill、版本与使用环境
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 实际任务与完成情况
      description: 是否完成样例、替换自己的内容、修改后重新生成？失败也很有价值。
    validations:
      required: true
  - type: textarea
    id: assistance
    attributes:
      label: 卡点与人工处理
      description: 记录手工改动、协助次数及耗时；不确定的数据不必填写。
  - type: textarea
    id: reuse
    attributes:
      label: 是否再次使用，以及下一次任务
      description: 区分已经发生的复用与将来的使用意愿。
